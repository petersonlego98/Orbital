project(":tests"){
    apply plugin: "java"

    dependencies{
        testImplementation project(":core")
        testImplementation project(":desktop")
        // SDL backs the windowed Vulkan path, so the suite that renders into a swapchain has to
        // open a real window the same way the game does.
        testImplementation arcModule("backends:backend-sdl")
        testImplementation "org.junit.jupiter:junit-jupiter-params:5.7.1"
        testImplementation "org.junit.jupiter:junit-jupiter-api:5.7.1"
        testImplementation arcModule("backends:backend-headless")
        testImplementation "org.json:json:20230618"
        testRuntimeOnly "org.lwjgl:lwjgl:3.4.3:natives-windows"
        testRuntimeOnly "org.lwjgl:lwjgl-shaderc:3.4.3:natives-windows"
        testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.7.1"
        testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    }

    tasks.withType(JavaCompile){
        targetCompatibility = JavaVersion.VERSION_17
        sourceCompatibility = JavaVersion.VERSION_17
        options.compilerArgs.addAll(['--release', '17'])
    }

    test{
        //fork every test so mods don't interact with each other
        forkEvery = 1
        jvmArgs = ["-XX:+HeapDumpOnOutOfMemoryError"]
        useJUnitPlatform()
        workingDir = new File("../core/assets")
        testLogging{
            exceptionFormat = 'full'
            showStandardStreams = true
        }

        // An ICD given as -Pvulkan.icd=<json> reaches the workers through the JVM arguments, and
        // the bridge applies it before the instance is created. Without it the suites skip
        // themselves on machines whose only driver is a software one, which is correct - OpenGL is
        // the shipping backend - but leaves the Vulkan path unverified.
        def icd = project.findProperty("vulkan.icd")
        if(icd){
            jvmArgs = jvmArgs + ["-Dorbital.vulkan.icd=" + icd]
        }
    }
}

