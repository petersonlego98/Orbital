project(":desktop"){
    apply plugin: "java"

    compileJava.options.fork = true

    dependencies{
        implementation project(":core")
        implementation arcModule("extensions:profiling")
        implementation arcModule("extensions:discord")
        implementation arcModule("natives:natives-filedialogs")
        implementation arcModule("extensions:filedialogs")
        implementation arcModule("natives:natives-desktop")
        implementation arcModule("natives:natives-freetype-desktop")

        if(debugged()) implementation project(":debug")

        implementation "com.github.Anuken:steamworks4j:$steamworksVersion"

        implementation arcModule("backends:backend-sdl")

        // GLSL 450 -> SPIR-V for the desktop Vulkan backend. Native binaries are loaded lazily,
        // so this dependency is only exercised when shader compilation is requested.
        implementation "org.lwjgl:lwjgl-shaderc:3.4.3"
        runtimeOnly "org.lwjgl:lwjgl:3.4.3:natives-windows"
        runtimeOnly "org.lwjgl:lwjgl-shaderc:3.4.3:natives-windows"
    }
}

project(":core"){
    apply plugin: "java-library"
    apply plugin: "kotlin"
    apply plugin: "kotlin-kapt"

    kapt{
        javacOptions{
            option("-source", "17")
            option("-target", "17")
        }
    }

    compileJava.options.fork = true

    def particleSimdResourceDir = layout.buildDirectory.dir("generated/resources/particle-simd")
    sourceSets.main.resources.srcDir(particleSimdResourceDir)

    tasks.register("buildParticleSimdNative"){
        inputs.files(
            file("src/orbital/graphics/ParticleSimdNative.cpp"),
            file("src/orbital/graphics/ParticleSimdAvx2.cpp")
        )
        outputs.dir(particleSimdResourceDir)

        doLast{
            if(!System.getProperty("os.name").toLowerCase().contains("windows")) return

            def env = System.getenv()
            def vswhere = new File(env.get("ProgramFiles(x86)") ?: "C:/Program Files (x86)", "Microsoft Visual Studio/Installer/vswhere.exe")
            def clPath = project.findProperty("simdCl") ?: env.get("SIMD_CL")
            def vcRoot = null

            if(clPath == null && vswhere.isFile()){
                def process = new ProcessBuilder(
                    vswhere.absolutePath,
                    "-latest", "-products", "*",
                    "-requires", "Microsoft.VisualStudio.Component.VC.Tools.x86.x64",
                    "-property", "installationPath"
                ).redirectErrorStream(true).start()
                vcRoot = process.inputStream.getText("UTF-8").trim()
                if(process.waitFor() != 0) vcRoot = null
            }

            if(clPath == null && vcRoot){
                def toolRoot = new File(vcRoot, "VC/Tools/MSVC")
                def versions = toolRoot.listFiles()?.findAll{ it.isDirectory() }?.sort{ a, b -> b.name <=> a.name }
                def candidate = versions ? new File(versions[0], "bin/Hostx64/x64/cl.exe") : null
                if(candidate?.isFile()) clPath = candidate.absolutePath
            }

            if(clPath == null){
                logger.lifecycle("Particle SIMD native build skipped: cl.exe unavailable; Java scalar fallback remains active.")
                return
            }

            if(vcRoot == null){
                def compilerDir = new File(clPath).parentFile.parentFile.parentFile.parentFile
                vcRoot = compilerDir.parentFile.parentFile.parentFile.parentFile.absolutePath
            }
            def vcTools = new File(vcRoot, "VC/Tools/MSVC")
            def vcVersionDir = vcTools.listFiles()?.findAll{ it.isDirectory() }?.sort{ a, b -> b.name <=> a.name }?.first()
            if(vcVersionDir == null){
                logger.lifecycle("Particle SIMD native build skipped: MSVC tool headers/libraries unavailable; Java scalar fallback remains active.")
                return
            }

            def jdkHome = new File(env.get("JAVA_HOME") ?: System.getProperty("java.home"))
            if(!new File(jdkHome, "include/jni.h").isFile()) jdkHome = jdkHome.parentFile
            def jniInclude = new File(jdkHome, "include")
            if(!new File(jniInclude, "jni.h").isFile()){
                logger.lifecycle("Particle SIMD native build skipped: JNI headers unavailable; Java scalar fallback remains active.")
                return
            }

            def kitsRoot = new File(env.get("ProgramFiles(x86)") ?: "C:/Program Files (x86)", "Windows Kits/10")
            def sdkIncludeRoot = new File(kitsRoot, "Include")
            def sdkVersionDir = sdkIncludeRoot.listFiles()?.findAll{ it.isDirectory() }?.sort{ a, b -> b.name <=> a.name }?.first()
            if(sdkVersionDir == null){
                logger.lifecycle("Particle SIMD native build skipped: Windows SDK unavailable; Java scalar fallback remains active.")
                return
            }

            def outputDir = particleSimdResourceDir.get().dir("native/windows-x86_64").asFile
            def objectDir = layout.buildDirectory.dir("particle-simd-objects").get().asFile
            outputDir.mkdirs()
            objectDir.mkdirs()

            def compilerEnv = new HashMap(env)
            compilerEnv.put("INCLUDE", [
                new File(vcVersionDir, "include"),
                new File(jdkHome, "include"),
                new File(jdkHome, "include/win32"),
                new File(sdkVersionDir, "ucrt"),
                new File(sdkVersionDir, "shared"),
                new File(sdkVersionDir, "um"),
                new File(sdkVersionDir, "winrt"),
                new File(sdkVersionDir, "cppwinrt")
            ].collect{ it.absolutePath }.join(";"))
            compilerEnv.put("LIB", [
                new File(vcVersionDir, "lib/x64"),
                new File(kitsRoot, "Lib/${sdkVersionDir.name}/ucrt/x64"),
                new File(kitsRoot, "Lib/${sdkVersionDir.name}/um/x64")
            ].collect{ it.absolutePath }.join(";"))
            compilerEnv.put("PATH", new File(vcVersionDir, "bin/Hostx64/x64").absolutePath + ";" + env.get("PATH"))

            def nativeSource = file("src/orbital/graphics/ParticleSimdNative.cpp")
            def avxSource = file("src/orbital/graphics/ParticleSimdAvx2.cpp")
            def nativeObject = new File(objectDir, "ParticleSimdNative.obj")
            def avxObject = new File(objectDir, "ParticleSimdAvx2.obj")
            def dll = new File(outputDir, "orbital_particlesimd.dll")
            def commonArgs = ["/nologo", "/c", "/O2", "/MT", "/fp:strict", "/EHsc", "/std:c++17", "/I${jniInclude.absolutePath}", "/I${new File(jniInclude, 'win32').absolutePath}"]

            def execOps = project.services.get(org.gradle.process.ExecOperations)
            execOps.exec{
                environment compilerEnv
                commandLine([clPath] + commonArgs + [nativeSource.absolutePath, "/Fo${nativeObject.absolutePath}"])
            }
            execOps.exec{
                environment compilerEnv
                commandLine([clPath] + commonArgs + ["/arch:AVX2", avxSource.absolutePath, "/Fo${avxObject.absolutePath}"])
            }
            execOps.exec{
                environment compilerEnv
                commandLine([clPath, "/nologo", "/LD", "/MT", nativeObject.absolutePath, avxObject.absolutePath, "/link", "/OUT:${dll.absolutePath}", "/IMPLIB:${new File(objectDir, 'orbital_particlesimd.lib').absolutePath}", "/MACHINE:X64"])
            }
        }
    }

    tasks.named("processResources"){
        dependsOn tasks.named("buildParticleSimdNative")
    }

    task preGen{
        outputs.upToDateWhen{ false }
        generateLocales()
        writeVersion()
        writeProcessors()
        writePlugins()
    }

    task copyChangelog{
        doLast{
            def props = loadVersionProps()
            def androidVersion = props['androidBuildCode'].toInteger() - 2
            def loglines = file("../changelog").text.split("\n")
            def notice = "[This is a truncated changelog, see Github for full notes]"
            def maxLength = 460

            def androidLogList = [notice] + loglines.findAll{ line -> !line.endsWith("]") || line.endsWith("[Mobile]") || line.endsWith("[Android]")}
            def result = ""
            androidLogList.forEach{line ->
                if(result.length() + line.length() + 1 < maxLength){
                    result += line + "\n"
                }
            }
            def changelogs = file("../fastlane/metadata/android/en-US/changelogs/")
            changelogs.mkdirs()
            try{
                new File(changelogs, androidVersion + ".txt").text = (result)
            }catch(Exception ignored){
            }
        }
    }

    task depsJar(type: Jar, dependsOn: [classes, ":server:dist"]){
        archiveClassifier = 'deps'
        from files(sourceSets.main.output.classesDirs)
        from{ configurations.runtimeClasspath.collect{ it.isDirectory() ? it : zipTree(it) } }
        from zipTree("../server/build/libs/server-release.jar")
        from files("src/")
        from files("../../Arc/natives/natives-desktop/libs")
        from files("../../Arc/arc-core/src/")
        from files("../../Arc/extensions/arcnet/src/")
        from files("../../Arc/extensions/g3d/src/")
        from files("../../Arc/extensions/flabel/src/")
        from files("../../Arc/extensions/freetype/src/")
        from files("../server/src/")

        exclude("META-INF/**")
        exclude("vfxshaders/**")
        exclude("maps/**")
        exclude("baseparts/**")
        exclude("vfxshaders/**")
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }

    task sourcesJar(type: Jar, dependsOn: classes){
        archiveClassifier = 'sources'
        from sourceSets.main.allSource
    }

    task assetsJar(type: Jar){
        dependsOn ":tools:pack"
        archiveClassifier = 'assets'

        into('assets'){
            from 'assets'
            exclude 'config', 'cache', 'music', 'sounds', 'sprites/fallback'
        }

        into('assets-raw/sprites'){
            from 'assets-raw/sprites_out'
            include '**/*.png'
        }
    }

    task musicJar(type: Jar){
        archiveClassifier = 'music'

        into('assets'){
            from 'assets'
            include '**/*.ogg', '**/*.mp3'
        }
    }

    dependencies{
        compileJava.dependsOn(preGen)

        api "at.yawk.lz4:lz4-java:1.12.0"
        api arcModule("arc-core")
        api arcModule("extensions:flabel")
        api arcModule("extensions:freetype")
        api arcModule("extensions:g3d")
        api arcModule("extensions:fx")
        api arcModule("extensions:arcnet")
        api "com.github.Anuken:rhino:$rhinoVersion"
        if(localArc && debugged()) api arcModule("extensions:recorder")
        if(localArc) api arcModule(":extensions:packer")

        compileOnly project(":annotations")
        if(!project.hasProperty("noKapt")) kapt project(":annotations")
    }

    afterEvaluate{
        task mergedJavadoc(type: Javadoc){
            def blacklist = [project(":desktop"), project(":server"), project(":annotations")]
            if(findProject(":android") != null){
                blacklist += project(":android")
            }

            source rootProject.subprojects.collect{ project ->
                if(!blacklist.contains(project) && project.hasProperty("sourceSets")){
                    return project.sourceSets.main.allJava
                }
            }

            classpath = files(rootProject.subprojects.collect { project ->
                if(!blacklist.contains(project) && project.hasProperty("sourceSets")){
                    return project.sourceSets.main.compileClasspath
                }
            })
            destinationDir = new File(buildDir, 'javadoc')
        }
    }

    gradle.taskGraph.whenReady{
        //these are completely unnecessary
        tasks.kaptGenerateStubsKotlin.onlyIf{ false }
        tasks.compileKotlin.onlyIf{ false }
    }

    //comp** classes are only used for code generation
    jar{
        exclude("orbital/entities/comp/**")
    }
}

