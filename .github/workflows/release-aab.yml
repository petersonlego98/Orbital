name: Release AAB to Google Play

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Track do Google Play"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
        default: internal

      release_status:
        description: "Status do release no Play"
        type: choice
        options:
          - draft
          - completed
        default: draft

      package_name:
        description: "Application ID (vazio = detectar no Gradle)"
        required: false
        default: ""

      version_code:
        description: "Version code (vazio = valor do Gradle)"
        required: false
        default: ""

      gradle_task:
        description: "Tarefa Gradle de build do bundle"
        required: false
        default: bundleRelease

      mapping_file:
        description: "mapping.txt relativo ao repositório (vazio = detectar automaticamente)"
        required: false
        default: ""

      release_notes_dir:
        description: "Pasta relativa de notas whatsnew no repositório (opcional)"
        required: false
        default: ""

      changes_not_sent_for_review:
        description: "Enviar sem revisão (changesNotSentForReview)"
        type: boolean
        default: true

      upload_to_play:
        description: "Fazer upload no Google Play"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-aab-${{ github.ref }}
  cancel-in-progress: false

env:
  KEYSTORE_FILE: android/keystores/release.keystore
  KEYSTORE_PROPERTIES: keystore.properties

jobs:
  build-and-release:
    name: Build AAB + Google Play
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validar secrets obrigatórios
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_STORE_PASSWORD }}
          UPLOAD_TO_PLAY: ${{ inputs.upload_to_play }}
        run: |
          set -euo pipefail
          if [ "${UPLOAD_TO_PLAY,,}" = "true" ]; then
            if [ -z "$PLAY_JSON" ]; then
              echo "::error::Secret PLAY_SERVICE_ACCOUNT_JSON não configurado no repositório."
              exit 1
            fi
          else
            echo "Build sem upload: o secret da conta de serviço do Play não é obrigatório."
          fi
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 não configurado no repositório."
            exit 1
          fi
          if [ -z "$KEYSTORE_ALIAS" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_ALIAS não configurado no repositório."
            exit 1
          fi
          if [ -z "$STORE_PASSWORD" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_STORE_PASSWORD não configurado no repositório."
            exit 1
          fi

      - name: Restaurar e validar keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$(dirname "$KEYSTORE_FILE")"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"

          EFFECTIVE_KEY_PASSWORD="${KEY_PASSWORD:-$STORE_PASSWORD}"
          {
            printf 'storeFile=%s\n' "$KEYSTORE_FILE"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$EFFECTIVE_KEY_PASSWORD"
          } > "$KEYSTORE_PROPERTIES"
          chmod 600 "$KEYSTORE_PROPERTIES"

          PASSWORD_FILE="$(mktemp)"
          trap 'rm -f "$PASSWORD_FILE"' EXIT
          printf '%s' "$STORE_PASSWORD" > "$PASSWORD_FILE"
          if ! keytool -list \
            -keystore "$KEYSTORE_FILE" \
            -storepass:file "$PASSWORD_FILE" \
            -alias "$KEY_ALIAS" >/dev/null; then
            echo "::error::Não foi possível abrir o keystore com o alias/senha configurados."
            exit 1
          fi
          echo "Keystore restaurado e validado ($(wc -c < "$KEYSTORE_FILE") bytes)."

      - name: Detectar applicationId
        id: package
        env:
          PACKAGE_NAME_INPUT: ${{ inputs.package_name }}
        run: |
          set -euo pipefail
          PKG="$PACKAGE_NAME_INPUT"
          if [ -z "$PKG" ]; then
            PKG=$(python3 - <<'PY'
          import re
          from pathlib import Path

          pattern = re.compile(r"(?<![A-Za-z0-9_])applicationId\s*(?:=\s*)?[\"']([^\"']+)[\"']")
          candidates = [Path("app/build.gradle.kts"), Path("app/build.gradle")]
          candidates += sorted(
              path for path in Path(".").glob("*/build.gradle*")
              if "build" not in path.parts
          )
          for path in candidates:
              if not path.is_file():
                  continue
              match = pattern.search(path.read_text(encoding="utf-8"))
              if match:
                  print(match.group(1))
                  break
          PY
          )
          fi
          if [ -z "$PKG" ]; then
            echo "::error::Não foi possível detectar o applicationId. Informe o parâmetro package_name."
            exit 1
          fi
          if [[ ! "$PKG" =~ ^[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+$ ]]; then
            echo "::error::Application ID inválido: use um pacote Android como com.exemplo.meuapp."
            exit 1
          fi
          echo "package_name=$PKG" >> "$GITHUB_OUTPUT"
          echo "Application ID: $PKG"

      - name: Build do AAB
        env:
          GRADLE_TASK: ${{ inputs.gradle_task }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          if [[ ! "$GRADLE_TASK" =~ ^[A-Za-z0-9][A-Za-z0-9:._-]*$ ]]; then
            echo "::error::Nome de tarefa Gradle inválido."
            exit 1
          fi

          GRADLE_ARGS=("$GRADLE_TASK")
          if [ -n "$VERSION_CODE" ]; then
            if [[ ! "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
              echo "::error::O version code deve ser numérico."
              exit 1
            fi
            if ! python3 -c 'import os; value = int(os.environ["VERSION_CODE"]); raise SystemExit(0 if 1 <= value <= 2100000000 else 1)'; then
              echo "::error::O version code deve estar entre 1 e 2100000000."
              exit 1
            fi
            GRADLE_ARGS+=("-PversionCodeOverride=$VERSION_CODE")
          fi

          chmod +x ./gradlew
          echo "Executando: ./gradlew ${GRADLE_ARGS[*]}"
          ./gradlew "${GRADLE_ARGS[@]}" --no-daemon --stacktrace

      - name: Localizar AAB gerado
        id: aab
        run: |
          set -euo pipefail
          mapfile -t AABS < <(
            find "$GITHUB_WORKSPACE" -type f -name '*.aab' \
              -path '*/build/outputs/bundle/*/*' -print | sort
          )
          if [ "${#AABS[@]}" -eq 0 ]; then
            echo "::error::Nenhum arquivo .aab foi encontrado após o build."
            exit 1
          fi
          if [ "${#AABS[@]}" -gt 1 ]; then
            echo "::warning::Mais de um AAB foi encontrado; usando o primeiro resultado ordenado."
          fi
          AAB="${AABS[0]}"
          echo "path=$AAB" >> "$GITHUB_OUTPUT"
          echo "AAB: $AAB ($(du -h "$AAB" | cut -f1))"

      - name: Localizar mapping.txt
        id: mapping
        env:
          MAPPING_FILE_INPUT: ${{ inputs.mapping_file }}
        run: |
          set -euo pipefail
          MAPPING=""
          if [ -n "$MAPPING_FILE_INPUT" ]; then
            if [[ "$MAPPING_FILE_INPUT" == /* || "$MAPPING_FILE_INPUT" =~ ^[A-Za-z]: || "$MAPPING_FILE_INPUT" == ".." || "$MAPPING_FILE_INPUT" == ../* || "$MAPPING_FILE_INPUT" == */.. || "$MAPPING_FILE_INPUT" == */../* ]]; then
              echo "::error::mapping_file deve ser um caminho relativo seguro dentro do repositório."
              exit 1
            fi
            MAPPING="$GITHUB_WORKSPACE/$MAPPING_FILE_INPUT"
            if [ ! -f "$MAPPING" ]; then
              echo "::error::mapping_file não existe no runner: $MAPPING_FILE_INPUT"
              exit 1
            fi
          else
            mapfile -t MAPPINGS < <(
              find "$GITHUB_WORKSPACE" -type f -path '*/build/outputs/mapping/*/mapping.txt' -print | sort
            )
            if [ "${#MAPPINGS[@]}" -gt 0 ]; then
              MAPPING="${MAPPINGS[0]}"
            else
              echo "::warning::Nenhum mapping.txt foi gerado; o upload continuará sem mapping."
            fi
          fi
          echo "path=$MAPPING" >> "$GITHUB_OUTPUT"

      - name: Validar pasta de notas de versão
        id: notes
        env:
          RELEASE_NOTES_DIR: ${{ inputs.release_notes_dir }}
        run: |
          set -euo pipefail
          NOTES_DIR=""
          if [ -n "$RELEASE_NOTES_DIR" ]; then
            if [[ "$RELEASE_NOTES_DIR" == /* || "$RELEASE_NOTES_DIR" =~ ^[A-Za-z]: || "$RELEASE_NOTES_DIR" == ".." || "$RELEASE_NOTES_DIR" == ../* || "$RELEASE_NOTES_DIR" == */.. || "$RELEASE_NOTES_DIR" == */../* ]]; then
              echo "::error::release_notes_dir deve ser um caminho relativo seguro dentro do repositório."
              exit 1
            fi
            NOTES_DIR="$GITHUB_WORKSPACE/$RELEASE_NOTES_DIR"
            if [ ! -d "$NOTES_DIR" ]; then
              echo "::error::release_notes_dir não existe no repositório: $RELEASE_NOTES_DIR"
              exit 1
            fi
          fi
          echo "path=$NOTES_DIR" >> "$GITHUB_OUTPUT"

      - name: Publicar AAB como artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: ${{ steps.aab.outputs.path }}
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Publicar mapping.txt como artifact
        if: ${{ steps.mapping.outputs.path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-mapping
          path: ${{ steps.mapping.outputs.path }}
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Upload para o Google Play
        if: ${{ inputs.upload_to_play == true || inputs.upload_to_play == 'true' }}
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ steps.package.outputs.package_name }}
          releaseFiles: ${{ steps.aab.outputs.path }}
          tracks: ${{ inputs.track }}
          status: ${{ inputs.release_status }}
          changesNotSentForReview: ${{ inputs.changes_not_sent_for_review }}
          mappingFile: ${{ steps.mapping.outputs.path }}
          whatsNewDirectory: ${{ steps.notes.outputs.path }}

      - name: Resumo
        if: always()
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.package_name || inputs.package_name }}
          TRACK: ${{ inputs.track }}
          RELEASE_STATUS: ${{ inputs.release_status }}
          VERSION_CODE: ${{ inputs.version_code }}
          UPLOAD_TO_PLAY: ${{ inputs.upload_to_play }}
          AAB_PATH: ${{ steps.aab.outputs.path }}
          MAPPING_PATH: ${{ steps.mapping.outputs.path }}
        run: |
          {
            echo "## Release AAB"
            echo ""
            echo "| Item | Valor |"
            echo "| --- | --- |"
            echo "| Aplicativo | \`$PACKAGE_NAME\` |"
            echo "| Track | \`$TRACK\` |"
            echo "| Status | \`$RELEASE_STATUS\` |"
            echo "| Version code | \`${VERSION_CODE:-do Gradle}\` |"
            echo "| Upload no Play | \`$UPLOAD_TO_PLAY\` |"
            echo "| AAB | \`${AAB_PATH:-não gerado}\` |"
            echo "| Mapping | \`${MAPPING_PATH:-não gerado}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
