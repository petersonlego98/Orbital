sourceSets.main.java.srcDirs = ["src/"]

def vulkanResourceDir = layout.buildDirectory.dir("generated/resources/vulkan")
sourceSets.main.resources.srcDir(vulkanResourceDir)

// Native sources for one DLL: VulkanBootstrap.cpp backs VulkanSupport (device discovery) and
// VulkanDevice.cpp backs VulkanDevice (offscreen rendering core).
def vulkanSources = ["VulkanBootstrap", "VulkanDevice"].collect{ name ->
    file("src/orbital/desktop/vulkan/${name}.cpp")
}

tasks.register("buildVulkanNative"){
    inputs.files vulkanSources
    outputs.dir vulkanResourceDir

    doLast{
        if(!System.getProperty("os.name").toLowerCase().contains("windows")) return

        def env = System.getenv()
        def clPath = project.findProperty("simdCl") ?: env.get("SIMD_CL")
        def vcRoot = null
        def vswhere = new File(env.get("ProgramFiles(x86)") ?: "C:/Program Files (x86)", "Microsoft Visual Studio/Installer/vswhere.exe")

        if(clPath == null && vswhere.isFile()){
            def process = new ProcessBuilder(vswhere.absolutePath, "-latest", "-products", "*",
                "-requires", "Microsoft.VisualStudio.Component.VC.Tools.x86.x64",
                "-property", "installationPath").redirectErrorStream(true).start()
            vcRoot = process.inputStream.getText("UTF-8").trim()
            if(process.waitFor() != 0) vcRoot = null
        }

        if(clPath == null && vcRoot){
            def toolRoot = new File(vcRoot, "VC/Tools/MSVC")
            def versions = toolRoot.listFiles()?.findAll{ it.isDirectory() }?.sort{ a, b -> b.name <=> a.name }
            def candidate = versions ? new File(versions[0], "bin/Hostx64/x64/cl.exe") : null
            if(candidate?.isFile()) clPath = candidate.absolutePath
        }

        if(clPath == null){
            logger.lifecycle("Vulkan native probe skipped: cl.exe unavailable; OpenGL remains active.")
            return
        }

        if(vcRoot == null){
            def compilerDir = new File(clPath).parentFile.parentFile.parentFile.parentFile
            vcRoot = compilerDir.parentFile.parentFile.parentFile.parentFile.absolutePath
        }
        def vcVersionDir = new File(vcRoot, "VC/Tools/MSVC").listFiles()?.findAll{ it.isDirectory() }?.sort{ a, b -> b.name <=> a.name }?.first()
        if(vcVersionDir == null){
            logger.lifecycle("Vulkan native probe skipped: MSVC tools unavailable; OpenGL remains active.")
            return
        }

        def jdkHome = new File(env.get("JAVA_HOME") ?: System.getProperty("java.home"))
        if(!new File(jdkHome, "include/jni.h").isFile()) jdkHome = jdkHome.parentFile
        def jniInclude = new File(jdkHome, "include")
        if(!new File(jniInclude, "jni.h").isFile()){
            logger.lifecycle("Vulkan native probe skipped: JNI headers unavailable; OpenGL remains active.")
            return
        }

        def kitsRoot = new File(env.get("ProgramFiles(x86)") ?: "C:/Program Files (x86)", "Windows Kits/10")
        def sdkVersionDir = new File(kitsRoot, "Include").listFiles()?.findAll{ it.isDirectory() }?.sort{ a, b -> b.name <=> a.name }?.first()
        if(sdkVersionDir == null){
            logger.lifecycle("Vulkan native probe skipped: Windows SDK unavailable; OpenGL remains active.")
            return
        }

        def outputDir = vulkanResourceDir.get().dir("native/windows-x86_64").asFile
        def objectDir = layout.buildDirectory.dir("vulkan-objects").get().asFile
        def objects = vulkanSources.collect{ source ->
            new File(objectDir, source.name.replace(".cpp", ".obj"))
        }
        outputDir.mkdirs()
        objectDir.mkdirs()

        def compilerEnv = new HashMap(env)
        compilerEnv.put("INCLUDE", [
            new File(vcVersionDir, "include"), jniInclude, new File(jniInclude, "win32"),
            new File(sdkVersionDir, "ucrt"), new File(sdkVersionDir, "shared"),
            new File(sdkVersionDir, "um"), new File(sdkVersionDir, "winrt"),
            new File(sdkVersionDir, "cppwinrt"),
            // Vendored Vulkan headers (VulkanDevice.cpp includes <vulkan/vulkan_core.h>).
            new File(projectDir, "src/orbital/desktop/vulkan/include")
        ].collect{ it.absolutePath }.join(";"))
        compilerEnv.put("LIB", [
            new File(vcVersionDir, "lib/x64"),
            new File(kitsRoot, "Lib/${sdkVersionDir.name}/ucrt/x64"),
            new File(kitsRoot, "Lib/${sdkVersionDir.name}/um/x64")
        ].collect{ it.absolutePath }.join(";"))
        compilerEnv.put("PATH", new File(vcVersionDir, "bin/Hostx64/x64").absolutePath + ";" + env.get("PATH"))

        def dll = new File(outputDir, "orbital_vulkan.dll")
        def execOps = project.services.get(org.gradle.process.ExecOperations)
        vulkanSources.indices.each{ index ->
            execOps.exec{
                environment compilerEnv
                commandLine([clPath, "/nologo", "/c", "/O2", "/MT", "/EHsc", "/std:c++17",
                    "/I${jniInclude.absolutePath}", "/I${new File(jniInclude, 'win32').absolutePath}",
                    vulkanSources[index].absolutePath, "/Fo${objects[index].absolutePath}"])
            }
        }
        execOps.exec{
            environment compilerEnv
            commandLine([clPath, "/nologo", "/LD", "/MT"] + objects.collect{ it.absolutePath } + ["/link",
                "/OUT:${dll.absolutePath}", "/IMPLIB:${new File(objectDir, 'orbital_vulkan.lib').absolutePath}",
                // user32 provides FindWindowA, used to attach a Vulkan surface to the game's
                // own SDL window; it is always present on Windows.
                "user32.lib",
                "/MACHINE:X64"])
        }
    }
}

tasks.named("processResources"){
    dependsOn tasks.named("buildVulkanNative")
}

project.ext.mainClassName = "orbital.desktop.DesktopLauncher"
project.ext.assetsDir = new File("../core/assets")

def JDK_DIR = "$System.env.JDK_DIR"
def ICON_DIR = new File("$rootDir/core/assets/icons/icon.icns")
def platforms = ["Linux64", "Windows64", "MacOS"]

tasks.register('run', JavaExec){
    dependsOn classes
    mainClass = project.mainClassName
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
    workingDir = project.assetsDir
    ignoreExitValue = true

    if(System.getProperty("os.name").toLowerCase().contains("mac")){
        jvmArgs("-XstartOnFirstThread")
    }

    jvmArgs += "-XX:+ShowCodeDetailsInExceptionMessages"

    if(project.hasProperty("args")){
        args Eval.me(project.getProperties()["args"])
    }

    if(project.hasProperty("jvmArgs")){
        jvmArgs((List<String>) Eval.me(project.getProperties()["jvmArgs"]))
    }

    if(project.hasProperty("dataDir")){
        environment("ORBITAL_DATA_DIR", project.getProperties()["dataDir"])
    }

    if(args.contains("debug")){
        mainClass = "orbital.debug.DebugLauncher"
    }
}

tasks.register('dist', Jar){
    dependsOn configurations.runtimeClasspath
    dependsOn ":desktop:processResources"

    from files(sourceSets.main.output.classesDirs)
    from files(sourceSets.main.output.resourcesDir)
    from{ configurations.runtimeClasspath.collect{ it.isDirectory() ? it : zipTree(it) } }
    from files(project.assetsDir)
    exclude("config/**")
    exclude("**hs_err**.log")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    //GPLv3 notices and credits are also embedded in the jar for reference.
    from(rootProject.projectDir){
        include "LICENSE"
        include "README.md"
        include "CREDITS.md"
        include "NOTICE.txt"
        include "THIRD_PARTY_LICENSES/**"
        into "META-INF/legal"
    }

    //don't include steam shared libraries unless necessary
    if(!versionModifier.contains("steam")){
        exclude("**steam**.so", "**steam**.dll", "**steam**.dylib")
    }

    archiveFileName = "${appName}.jar"

    manifest{
        attributes 'Main-Class': project.mainClassName
        //note: this doesn't do anything when launched from the bundled JVM
        attributes 'Enable-Native-Access': 'ALL-UNNAMED'
        attributes 'Multi-Release': 'true'
    }
}

if(!project.ext.hasSprites() && System.getenv("JITPACK") != "true"){
    println "Scheduling sprite packing."
    run.dependsOn ":tools:pack"
    dist.dependsOn ":tools:pack"
}

//this is only for local testing
//add -Prelease -PversionModifier=steam as build properties
tasks.register('steamtest'){
    dependsOn dist
    doLast{
        copy{
            from "build/libs/Orbital.jar"
            if(project.hasProperty("destination")){
                into project.property("destination")
            }else if(System.properties["os.name"].contains("Mac")){
                into "/Users/anuke/Library/Application Support/Steam/steamapps/common/Orbital/Orbital.app/Contents/Resources"
            }else{
                into "/home/anuke/.steam/steam/steamapps/common/Orbital/jre"
            }
            rename("Orbital.jar", "desktop.jar")
        }
    }
}

//required templates:
//- Windows32: Not provided by Packr! This uses Java 8
//required JDKs:
//- Windows64
//- Linux64
//- Mac
platforms.each{ platform ->
    task "packr${platform.toString()}"{
        dependsOn dist

        doLast{
            copy{
                into "build/packr/"
                rename("${appName}.jar", "desktop.jar")
                from "build/libs/${appName}.jar"
            }

            delete{
                delete "build/packr/output/"
            }

            def jarPath = JDK_DIR + "packr.jar"
            def args = new String[]{"java", "-jar", jarPath}

            args += new String[]{
                "--platform", platform == "MacOS" ? "Mac" : platform.toString(),
                "--jdk", JDK_DIR + "jre-${platform.toString().toLowerCase()}",
                "--executable", appName,
                "--classpath", "$rootDir/desktop/build/packr/desktop.jar".toString(),
                "--mainclass", project.ext.mainClassName,
                "--verbose",
                "--bundle", getPackage() + ".mac",
                "--icon", ICON_DIR,
                "--output", "$rootDir/desktop/build/packr/output".toString(),
                "--removelibs", "$rootDir/desktop/build/packr/desktop.jar".toString()
            }

            args += "--vmargs"

            if(platform == "MacOS"){
                args += "XstartOnFirstThread"
            }

            args += "Dhttps.protocols=TLSv1.2,TLSv1.1,TLSv1"
            args += "XX:+ShowCodeDetailsInExceptionMessages"
            args += "XX:+UseCompactObjectHeaders"
            args += "enable-native-access=ALL-UNNAMED"

            project.services.get(ExecOperations).exec{
                commandLine args.toList()
                standardOutput = System.out
            }

            def outputJsonFile = platform != "MacOS" ? file("build/packr/output/Orbital.json") : file("build/packr/output/${appName}.app/Contents/Resources/Orbital.json")

            if(platform != "MacOS"){
                copy{
                    into "build/packr/output/jre/"
                    from "build/packr/output/desktop.jar"
                }

                delete{
                    delete "build/packr/output/desktop.jar"
                }

                outputJsonFile.text = outputJsonFile.text.replace("desktop.jar", "jre/desktop.jar")
            }else{
                copy{
                    into "build/packr/output/${appName}.app/Contents/"
                    from "build/packr/output/Contents/"
                }

                delete{
                    delete "build/packr/output/Contents/"
                }
            }

            //packr is broken and won't let me add one hyphen, so I have to do that myself later
            outputJsonFile.text = outputJsonFile.text.replace("-enable-native-access=ALL-UNNAMED", "--enable-native-access=ALL-UNNAMED")

            if((platform == "Windows64")){
                copy{
                    from "build/packr/output/jre/bin/msvcr100.dll"
                    into "build/packr/output/"
                    rename("msvcr100.dll", "MSVCR100.dll")
                }
            }

            if(versionModifier.contains("steam")){
                copy{
                    def lib = platform == "MacOS" || platform == "Linux64" ? "lib" : ""
                    from zipTree(platform == "MacOS" ? "build/packr/output/${appName}.app/Contents/Resources/desktop.jar" : "build/packr/output/jre/desktop.jar").matching{
                        include "${lib}frogworks${platform == "Windows64" ? '64.dll' : platform == "Linux64" ? '.so' : '.dylib'}"
                        include "${lib}steam_api${platform == "Windows64" ? '64.dll' : platform == "Linux64" ? '.so' : '.dylib'}"
                    }
                    into platform != "MacOS" ? "build/packr/output/" : "build/packr/output/${appName}.app/Contents/Resources"
                }
            }

            //Ship the license, credits and third-party notices next to the game binary.
            copy{
                from rootProject.projectDir
                into "build/packr/output"
                include "LICENSE"
                include "README.md"
                include "CREDITS.md"
                include "NOTICE.txt"
                include "THIRD_PARTY_LICENSES/**"
            }

            copy{
                from "build/packr/output"
                into "../deploy/${platform.toString()}"
            }
        }

        task "zip${platform.toString()}"(type: Zip){
            from "build/packr/output"
            archiveFileName = "${generateDeployName(platform.toString())}.zip"
            destinationDirectory = (file("../deploy"))

            doLast{
                delete{
                    delete "build/packr/"
                }
            }
        }

        finalizedBy "zip${platform.toString()}"

    }
}
